<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>顧客一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-size: 0.85rem; font-family: "Meiryo", sans-serif; }
        .page-container { background-color: #fff; border: 1px solid #dee2e6; padding: 15px; margin: 20px; }
        
        /* 検索エリア（詳細画面と統一） */
        .search-area { border: 1px solid #dee2e6; margin-bottom: 20px; }
        .search-header { background-color: #0d6efd; color: white; padding: 6px 12px; font-weight: bold; }
        .search-body { padding: 15px; background-color: #fff; }
        
        /* ラベルと入力欄（帳票スタイル） */
        .search-label { font-weight: bold; color: #495057; display: block; margin-bottom: 2px; }
        
        /* テーブル */
        .table-header { background-color: #e9ecef; font-weight: bold; text-align: center; white-space: nowrap; }
        .col-chk { width: 40px; text-align: center; }
        
        /* 角丸なし */
        .form-control, .form-select, .btn { border-radius: 0 !important; }
    </style>
</head>
<body>
    <div class="page-container">
        <h4 class="mb-3 border-bottom pb-2">顧客一覧</h4>

        <div class="search-area">
            <div class="search-header">検索条件</div>
            <div class="search-body">
                <form method="get" action="/" th:object="${searchForm}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-2">
                            <span class="search-label">顧客コード</span>
                            <input type="text" class="form-control" placeholder="未入力" readonly>
                        </div>
                        <div class="col-md-2">
                            <span class="search-label">業種</span>
                            <select class="form-select" th:field="*{industryCode}">
                                <option value="">(すべて)</option>
                                <option th:each="entry : ${industryMap}" th:value="${entry.key}" th:text="${entry.value}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <span class="search-label">会社名</span>
                            <input type="text" class="form-control" th:field="*{companyName}">
                        </div>
                        <div class="col-md-4">
                            <span class="search-label">会社名(カナ)</span>
                            <input type="text" class="form-control" th:field="*{companyNameKana}">
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-5">
                            <span class="search-label">登録日</span>
                            <div class="d-flex gap-2">
                                <input type="date" class="form-control" th:field="*{dateFrom}">
                                <span class="align-self-center">～</span>
                                <input type="date" class="form-control" th:field="*{dateTo}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <span class="search-label">メール配信</span>
                            <div class="pt-2">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="isEmailAllowed" value="" th:checked="${searchForm.isEmailAllowed == null}" id="all">
                                    <label class="form-check-label" for="all">すべて</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="isEmailAllowed" value="true" th:checked="${searchForm.isEmailAllowed == true}" id="ok">
                                    <label class="form-check-label" for="ok">許可</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="isEmailAllowed" value="false" th:checked="${searchForm.isEmailAllowed == false}" id="ng">
                                    <label class="form-check-label" for="ng">不可</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 text-end align-self-end">
                            <a href="/" class="btn btn-secondary me-2">クリア</a>
                            <button type="submit" class="btn btn-primary px-4">検索</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive" style="max-height: 500px; border: 1px solid #dee2e6;">
            <table class="table table-bordered table-striped table-hover mb-0">
                <thead class="table-header sticky-top">
                    <tr>
                        <th class="col-chk">CHK</th>
                        <th>ID</th>
                        <th>会社名</th>
                        <th>会社名(カナ)</th>
                        <th>業種</th>
                        <th>担当者</th>
                        <th>TEL</th>
                        <th>登録日</th>
                        <th>配信</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="customer : ${customers}">
                        <td class="text-center"><input type="checkbox" class="form-check-input" th:value="${customer.customerId}"></td>
                        <td><a th:href="@{/customers/edit/{id}(id=${customer.customerId})}" th:text="${customer.customerId}"></a></td>
                        <td th:text="${customer.companyName}"></td>
                        <td th:text="${customer.companyNameKana}"></td>
                        <td th:text="${industryMap[customer.industryCode]}"></td>
                        <td th:text="${customer.contactPerson}"></td>
                        <td th:text="${customer.telNo}"></td>
                        <td th:text="${#temporals.format(customer.createdAt, 'yyyy-MM-dd')}"></td>
                        <td class="text-center" th:text="${customer.isEmailAllowed ? '可' : '不可'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div>
                 <button class="btn btn-success me-2" type="button" onclick="exportCsv()">CSV出力</button>
                 <button class="btn btn-danger" type="button" onclick="deleteSelected()">削除</button>
            </div>
            <nav>
                <ul class="pagination mb-0">
                    <li class="page-item"><a class="page-link" href="#">前へ</a></li>
                    <li class="page-item"><a class="page-link" href="#">次へ</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <script>
        function exportCsv() {
            const checked = document.querySelectorAll('tbody .form-check-input:checked');
            if (checked.length === 0) {
                alert('チェックされた項目がありません');
                return;
            }
            const ids = Array.from(checked).map(cb => cb.value).join(',');
            alert('CSV出力: ' + ids + ' のデータを出力します（スタブ）');
        }

        function deleteSelected() {
            const checked = document.querySelectorAll('tbody .form-check-input:checked');
            if (checked.length === 0) {
                alert('チェックされた項目がありません');
                return;
            }
            const ids = Array.from(checked).map(cb => cb.value).join(',');
            if (confirm('選択された ' + checked.length + ' 件を削除しますか？')) {
                alert('削除処理: ' + ids + ' を削除します（スタブ）');
            }
        }
    </script>
</body>
</html>
